<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Trained</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trained">
<meta name="theme-color" content="#0d0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Trained</h1>
  <button id="settingsBtn" class="iconbtn" type="button" aria-label="Settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</header>

<div id="saveBanner" class="savebanner" role="alert" hidden>
  <span>Couldn't save. Back up now.</span>
  <button id="saveBannerBtn" type="button">Back up</button>
</div>

<main>
  <section id="list" aria-label="Categories"></section>

  <section class="history" aria-label="History">
    <div class="histhead">
      <span id="histMonths" class="histmonths"></span>
      <span id="count28" class="count28"></span>
    </div>
    <div class="weekdays" aria-hidden="true"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
    <div id="grid" class="grid"></div>
    <div id="legend" class="legend"></div>
    <h2 class="loghead">Last 28 days</h2>
    <div id="log" class="log"></div>
  </section>
</main>

<!-- shared overlay for the sheets -->
<div id="overlay" class="overlay"></div>

<!-- backdate sheet -->
<div id="logSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="logTitle">
  <h3 id="logTitle">Log</h3>
  <div class="seg" id="whenSeg">
    <button type="button" data-when="today" class="on">Today</button>
    <button type="button" data-when="d1"></button>
    <button type="button" data-when="d2"></button>
    <button type="button" data-when="custom">Pick day</button>
  </div>
  <input type="date" id="customDate" class="hidden" aria-label="Pick a day">
  <input type="text" id="logNote" placeholder="Note (optional)" maxlength="60" aria-label="Note">
  <div class="sheetactions">
    <button id="logCancel" type="button" class="btn">Cancel</button>
    <button id="logConfirm" type="button" class="btn primary">Log</button>
  </div>
</div>

<!-- day sheet -->
<div id="daySheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
  <h3 id="dayTitle">Day</h3>
  <div id="dayBody"></div>
</div>

<!-- confirm sheet (above everything) -->
<div id="confirmOverlay" class="overlay top"></div>
<div id="confirmSheet" class="sheet top" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <h3 id="confirmTitle">Confirm</h3>
  <p id="confirmBody" class="sheetbody"></p>
  <div class="sheetactions">
    <button id="confirmNo" type="button" class="btn">Cancel</button>
    <button id="confirmYes" type="button" class="btn primary">OK</button>
  </div>
</div>

<!-- settings -->
<div id="settingsOverlay" class="overlay"></div>
<div id="settingsModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
  <div class="modalhead">
    <h3 id="settingsTitle">Settings</h3>
    <button id="closeSettings" type="button" class="textbtn">Done</button>
  </div>

  <h4>Categories</h4>
  <div id="categoryList"></div>
  <div class="addcatrow">
    <input type="text" id="newCat" placeholder="New category" maxlength="20" aria-label="New category name">
    <button id="addCat" type="button" class="btn">Add</button>
  </div>
  <p id="catCapNote" class="fineprint"></p>

  <h4>Back up</h4>
  <button id="backupBtn" type="button" class="btn wide">Back up to Files</button>
  <p id="backupNote" class="fineprint"></p>

  <button id="restoreBtn" type="button" class="btn wide">Restore from backup</button>
  <input type="file" id="restoreFile" accept="application/json,.json" class="hidden">
  <div id="restoreBox" class="restorebox" hidden>
    <p id="restoreMsg" class="restoremsg"></p>
    <div id="restoreActions" class="sheetactions" hidden>
      <button id="restoreCancel" type="button" class="btn">Cancel</button>
      <button id="restoreConfirm" type="button" class="btn primary">Replace data</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
